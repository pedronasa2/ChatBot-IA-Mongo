# Configuração local da variante MongoDB.
# Variáveis de ambiente continuam tendo prioridade sobre os valores padrão.
spring:
  config:
    import: optional:file:./config/integracao-local.properties,optional:file:./backend/config/integracao-local.properties,optional:file:./config/banco-local.properties,optional:file:./backend/config/banco-local.properties
server:
  port: ${SERVER_PORT:8087}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
