painel:
  integracao:
    token-metricas: ${METRICS_INGESTION_TOKEN:}
spring:
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/painel}
    username: ${DATABASE_USER:painel}
    password: ${DATABASE_PASSWORD}
  session:
    timeout: -1s
    jdbc:
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: -1s
      cookie:
        max-age: 2147483647s
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
