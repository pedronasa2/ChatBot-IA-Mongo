painel:
  integracao:
    token-modulos: ${MODULES_INTEGRATION_TOKEN:}
    token-metricas: ${METRICS_INGESTION_TOKEN:}
spring:
  profiles:
    default: local
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27027/painel_mongo?replicaSet=rs0&directConnection=true&uuidRepresentation=standard}
  session:
    timeout: -1s
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: -1s
      cookie:
        max-age: 2147483647s
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
