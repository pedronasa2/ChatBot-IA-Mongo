painel:
  integracao:
    token-metricas: ${METRICS_INGESTION_TOKEN:}
spring:
  profiles:
    default: local
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27027/painel_mongo?replicaSet=rs0&directConnection=true&uuidRepresentation=standard}
  session:
    timeout: -1s
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: -1s
      cookie:
        max-age: 2147483647s
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/**
