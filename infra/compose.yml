services:
  backend:
    ports: ["127.0.0.1:${PANEL_PORT:-4208}:8080"]
    build: ..
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: ${MONGODB_URI:?Preencha MONGODB_URI com o banco dedicado MongoDB}
      MODULES_INTEGRATION_TOKEN: ${MODULES_INTEGRATION_TOKEN:-}
      METRICS_INGESTION_TOKEN: ${METRICS_INGESTION_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    restart: unless-stopped
  provision:
    profiles: [tools]
    build: ..
    environment:
      MONGODB_URI: ${MONGODB_URI:?Preencha MONGODB_URI}
    stdin_open: true
    tty: true
    command: ["--spring.profiles.active=provision", "--spring.main.web-application-type=none"]
