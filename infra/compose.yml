services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: painel
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Preencha DATABASE_PASSWORD em infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U painel -d painel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: ${DATABASE_URL:?Preencha DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER:?Preencha DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Preencha DATABASE_PASSWORD}
      METRICS_INGESTION_TOKEN: ${METRICS_INGESTION_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:${PANEL_PORT:-4207}:80"
    depends_on:
      - backend
    restart: unless-stopped
  provision:
    profiles: [tools]
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Preencha DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER:?Preencha DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Preencha DATABASE_PASSWORD}
    stdin_open: true
    tty: true
    command: ["--spring.profiles.active=provision", "--spring.main.web-application-type=none"]
volumes:
  postgres_data:
